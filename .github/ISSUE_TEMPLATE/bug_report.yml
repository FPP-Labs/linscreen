name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LinScreen version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Distribution and desktop
      description: For example "Arch, Hyprland (Omarchy)" or "Ubuntu 24.04, GNOME on Wayland".
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Terminal output
      description: Run `linscreen --replace` in a terminal, reproduce the problem and paste the output.
      render: text
