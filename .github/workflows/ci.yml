name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and PyQt6
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pyqt6
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover tests -v

  packages:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb and .rpm
        run: CONTAINER_ENGINE=docker scripts/build-packages.sh
      - name: Install and smoke-test in containers
        run: CONTAINER_ENGINE=docker scripts/test-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
